<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Mosaic Heart 💜</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        .mosaic-body {
            background: radial-gradient(circle at 50% 30%, #fff2f7 0%, #ffe1ee 60%, #ffd4e5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
            overflow-x: hidden;
            position: relative;
        }

        .mosaic-header {
            text-align: center;
            margin-top: 35px;
            margin-bottom: 25px;
            z-index: 10;
        }

        .mosaic-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #6c234a;
            text-shadow: 0 2px 10px rgba(224, 94, 150, 0.25);
            margin-bottom: 4px;
        }

        .mosaic-subtitle {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            color: #a35b7f;
            letter-spacing: 0.5px;
        }

        .mosaic-wrapper {
            display: flex;
            justify-content: center;
            padding: 10px 20px 40px;
            filter: drop-shadow(0 18px 40px rgba(224, 94, 150, 0.4));
            transition: transform 0.3s ease;
        }

        .mosaic-wrapper:hover {
            transform: scale(1.015);
        }

        .mosaic-heart-container {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 530px;
            aspect-ratio: 1;
            clip-path: url(#heart-clip);
            -webkit-clip-path: url(#heart-clip);
            background: linear-gradient(135deg, #ff9bb7 0%, #e05e96 50%, #c92a63 100%);
            padding: 0;
        }

        .mosaic-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: 1.5px;
            background: rgba(255, 255, 255, 0.3);
        }

        .mosaic-tile {
            position: relative;
            overflow: hidden;
            background: #ffe6f0;
            cursor: pointer;
            transition: filter 0.25s ease;
        }

        .mosaic-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease, filter 0.35s ease;
            display: block;
        }

        .mosaic-tile:hover img {
            transform: scale(1.2);
            filter: brightness(1.1) saturate(1.15);
        }

        /* ── Modern Frosted Glass Overlay ── */
        #mosaic-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(18, 5, 22, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: overlayFadeIn 0.25s ease-out;
        }

        #mosaic-overlay.hidden {
            display: none !important;
        }

        .mosaic-overlay-content {
            background: rgba(255, 255, 255, 0.96);
            padding: 22px 26px 22px;
            border-radius: 26px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 179, 198, 0.5);
            max-width: 90vw;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: overlayZoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .mosaic-overlay-content img {
            max-width: 82vw;
            max-height: 68vh;
            border-radius: 16px;
            object-fit: contain;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
            display: block;
        }

        .mosaic-overlay-caption {
            font-family: 'Caveat', cursive;
            font-size: 2.1rem;
            color: #6c234a;
            margin-top: 14px;
            margin-bottom: 0;
            text-align: center;
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .mosaic-close-btn {
            position: absolute;
            top: 24px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: transform 0.2s, background 0.2s;
            z-index: 1010;
        }

        .mosaic-close-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }

        @keyframes overlayFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes overlayZoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 600px) {
            .mosaic-title { font-size: 2.2rem; }
            .mosaic-subtitle { font-size: 1.3rem; }
            .mosaic-heart-container { max-width: 90vw; }
            .mosaic-overlay-caption { font-size: 1.6rem; }
            .mosaic-overlay-content { padding: 16px 16px 18px; }
        }
    </style>
</head>
